<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova Vida Pet — Formulário de Adoção</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="page-adocao-form2">

  
  <header class="header">
    <div class="logo-area">
      <a href="index.html"><img src="imagens/Logo nova vida pet deitada.png" alt="Logo Nova Vida Pet" class="logo"></a>
    </div>
    <nav class="menu">
      <a href="adocao.html">Adoção</a>
      <a href="doacao.html">Doação</a>
      <a href="apadrinhar.html">Apadrinhar</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="parceiros.html">Parceiros</a>
      <a href="quemsomos.html">Quem somos</a>
    </nav>
    <div class="header-btns">
      <a href="entrar.html" class="btn-login">Entrar</a>
      <a href="cadastrar.html" class="btn-cadastro">Cadastre-se</a>
    </div>
  </header>

  
  <main class="form-main">
    <a href="adocao-form1.html" class="form-voltar">&#8592;</a>

    
    <div class="form-steps">
      
      <div class="step-circle step-ativo">
        <img src="imagens/Full Family.png" alt="Família">
      </div>
      
      <div class="step-circle step-ativo">
        <img src="imagens/Dog Heart.png" alt="Pet">
      </div>
      
      <div class="step-circle step-inativo">
        <img src="imagens/Exterior.png" alt="Moradia">
      </div>
      
      <div class="step-circle step-inativo">
        <img src="imagens/Check Mark.png" alt="Concluído">
      </div>
    </div>

    
    <h1 class="form-titulo">Precisamos saber mais sobre você!</h1>
    <p class="form-subtitulo">Preencha as informações abaixo</p>

    
    <div class="questoes-grid">

      
      <div class="questao-card" data-grupo="criancas">
        <p class="questao-pergunta">Tem crianças em casa?</p>
        <div class="opcoes-lista">
          <button class="opcao-btn" data-opcao="A">
            <span class="opcao-letra">A</span> Sim
          </button>
          <button class="opcao-btn" data-opcao="B">
            <span class="opcao-letra">B</span> Não
          </button>
        </div>
      </div>

      
      <div class="questao-card" data-grupo="cientes">
        <p class="questao-pergunta">Todos em casa estão cientes e de acordo com a adoção?</p>
        <div class="opcoes-lista">
          <button class="opcao-btn" data-opcao="A">
            <span class="opcao-letra">A</span> Sim
          </button>
          <button class="opcao-btn" data-opcao="B">
            <span class="opcao-letra">B</span> Não
          </button>
        </div>
      </div>

      
      <div class="questao-card" data-grupo="destino">
        <p class="questao-pergunta">O pet é pra você mesmo ou é um presente pra alguém?</p>
        <div class="opcoes-lista">
          <button class="opcao-btn" data-opcao="A">
            <span class="opcao-letra">A</span> Para mim mesmo.
          </button>
          <button class="opcao-btn" data-opcao="B">
            <span class="opcao-letra">B</span> Vou presentear alguém.
          </button>
        </div>
      </div>

    </div>

    
    <div class="form-continuar-wrap">
      <a href="adocao-form3.html" class="btn-form-continuar">Continuar</a>
    </div>

  </main>

  <script src="js/main.js" defer></script>
  <script>
    
    document.querySelectorAll('.questao-card').forEach(function(card) {
      card.querySelectorAll('.opcao-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          card.querySelectorAll('.opcao-btn').forEach(function(b) {
            b.classList.remove('selecionado');
          });
          btn.classList.add('selecionado');
        });
      });
    });
  </script>

</body>
</html>
