<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova Vida Pet — Formulário de Adoção</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="page-adocao-form1">

  
  <header class="header">
    <div class="logo-area">
      <a href="index.html"><img src="imagens/Logo nova vida pet deitada.png" alt="Logo Nova Vida Pet" class="logo"></a>
    </div>
    <nav class="menu">
      <a href="adocao.html">Adoção</a>
      <a href="doacao.html">Doação</a>
      <a href="apadrinhar.html">Apadrinhar</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="parceiros.html">Parceiros</a>
      <a href="quemsomos.html">Quem somos</a>
    </nav>
    <div class="header-btns">
      <a href="entrar.html" class="btn-login">Entrar</a>
      <a href="cadastrar.html" class="btn-cadastro">Cadastre-se</a>
    </div>
  </header>

  
  <main class="form-main">
    <a href="adocao-intro.html" class="form-voltar">&#8592;</a>

    
    <div class="form-steps">
      
      <div class="step-circle step-ativo">
        <img src="imagens/Full Family.png" alt="Família">
      </div>
      
      <div class="step-circle step-inativo">
        <img src="imagens/Dog Heart.png" alt="Pet">
      </div>
      
      <div class="step-circle step-inativo">
        <img src="imagens/Exterior.png" alt="Moradia">
      </div>
      
      <div class="step-circle step-inativo">
        <img src="imagens/Check Mark.png" alt="Concluído">
      </div>
    </div>

    
    <h1 class="form-titulo">Precisamos saber mais sobre você!</h1>
    <p class="form-subtitulo">Preencha as informações abaixo</p>

    
    <form class="form-grid-wrap" onsubmit="return false;">

      
      <div class="form-row row-2-wide">
        <input type="text" class="form-flow-input" placeholder="Nome completo *" required />
        <input type="text" class="form-flow-input" placeholder="CPF *" required />
      </div>

      
      <div class="form-row row-3">
        <input type="text" class="form-flow-input" placeholder="Data de nascimento *" required />
        <input type="email" class="form-flow-input" placeholder="E-mail *" required />
        <input type="tel" class="form-flow-input" placeholder="Celular *" required />
      </div>

      
      <div class="form-row row-2">
        <input type="text" class="form-flow-input" placeholder="Endereço *" required />
        <input type="text" class="form-flow-input" placeholder="Número *" required />
      </div>

      
      <div class="form-row row-3-addr">
        <input type="text" class="form-flow-input" placeholder="Bairro *" required />
        <input type="text" class="form-flow-input" placeholder="UF *" required maxlength="2" />
        <input type="text" class="form-flow-input" placeholder="Complemento" />
      </div>

      
      <div class="form-continuar-wrap">
        <a href="adocao-form2.html" class="btn-form-continuar">Continuar</a>
      </div>

    </form>
  </main>

  <script src="js/main.js" defer></script>

</body>
</html>
