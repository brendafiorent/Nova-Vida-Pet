<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Entrar - Nova Vida Pet</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-entrar">

  <!-- HEADER -->
  <header class="header">
    <div class="logo-area">
      <a href="index.html"><img src="imagens/Logo nova vida pet deitada.png" alt="Logo Nova Vida Pet" class="logo"></a>
    </div>
    <nav class="menu">
      <a href="adocao.html">Adoção</a>
      <a href="doacao.html">Doação</a>
      <a href="apadrinhar.html">Apadrinhar</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="parceiros.html">Parceiros</a>
      <a href="quemsomos.html">Quem somos</a>
    </nav>
    <div class="header-btns">
      <a href="entrar.html" class="btn-login">Entrar</a>
      <a href="cadastrar.html" class="btn-cadastro">Cadastre-se</a>
    </div>
  </header>

  <!-- CONTEÚDO -->
  <main class="entrar-main">

    <div class="entrar-card">

      <!-- LADO ESQUERDO: imagem -->
      <div class="entrar-foto">
        <img src="imagens/ChatGPT Image 22 de mai. de 2026, 14_52_51.png" alt="Cachorro e Gato">
      </div>

      <!-- LADO DIREITO: formulário -->
      <div class="entrar-form-side">

        <h1 class="entrar-titulo">Boas vindas a<br>Nova Vida Pet!</h1>
        <p class="entrar-subtitulo">Acesse sua conta</p>

        <input type="text"     class="entrar-input" placeholder="E-mail, CPF ou CNPJ">
        <input type="password" class="entrar-input" placeholder="Digite sua senha">

        <label class="entrar-check">
          <input type="checkbox"> Mantenha-me conectado
        </label>

        <a href="#" class="entrar-esqueci">Esqueci minha senha</a>

        <button class="btn-entrar-form">Entrar</button>

        <hr class="entrar-divisor">

        <p class="entrar-cadastro">
          Não tem uma conta? <a href="cadastrar.html">Cadastre-se</a>
        </p>

      </div>

    </div>

  </main>

  <script src="js/main.js" defer></script>

</body>
</html>
