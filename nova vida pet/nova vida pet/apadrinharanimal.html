<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apadrinhar Animal - Nova Vida Pet</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-apadrinharanimal">

  <!-- HEADER -->
  <header class="header">
    <div class="logo-area">
      <a href="index.html"><img src="imagens/Logo nova vida pet deitada.png" alt="Logo Nova Vida Pet" class="logo"></a>
    </div>
    <nav class="menu">
      <a href="adocao.html">Adoção</a>
      <a href="doacao.html">Doação</a>
      <a href="apadrinhar.html">Apadrinhar</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="parceiros.html">Parceiros</a>
      <a href="quemsomos.html">Quem somos</a>
    </nav>
    <div class="header-btns">
      <a href="entrar.html" class="btn-login">Entrar</a>
      <a href="cadastrar.html" class="btn-cadastro">Cadastre-se</a>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="animal-page">

    <!-- DETALHE DO ANIMAL -->
    <div class="detalhe-wrapper">
      <div class="detalhe-card">

        <!-- Foto -->
        <div class="detalhe-foto">
          <img id="foto-principal" src="" alt="">
        </div>

        <!-- Informações -->
        <div class="detalhe-info">
          <a href="apadrinhar.html" class="btn-fechar" aria-label="Voltar">✕</a>

          <h1 id="animal-nome" class="detalhe-nome"></h1>

          <div id="animal-tags" class="detalhe-tags"></div>

          <div class="conheca-bloco">
            <h3 class="conheca-titulo">Me conheça</h3>
            <p id="animal-descricao" class="conheca-texto"></p>
          </div>

          <div class="detalhe-acoes">
            <button class="btn-favoritar-detalhe" id="btn-favoritar" aria-label="Favoritar">♡</button>
            <button class="btn-adotar-detalhe">Apadrinhar!</button>
          </div>
        </div>

      </div>
    </div>

    <!-- VEJA TAMBÉM -->
    <section class="veja-tambem">
      <h2 class="veja-titulo">Veja também</h2>
      <div class="veja-grid" id="veja-grid"></div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer footer-rosa">
    <div class="footer-logo">
      <img src="imagens/Logo nova vida pet deitada.png" alt="Logo Nova Vida Pet">
    </div>
    <div class="socials">
      <div class="social">
        <img src="imagens/Instagram.png" alt="Instagram">
      </div>
      <div class="social">
        <img src="imagens/Vector face.png" alt="Facebook">
      </div>
    </div>
    <div class="footer-menu">
      <h3>Menu</h3>
      <div class="footer-links">
        <div>
          <a href="adocao.html">Adoção</a>
          <a href="doacao.html">Doação</a>
          <a href="apadrinhar.html">Apadrinhar</a>
        </div>
        <div>
          <a href="#">Voluntariar-se</a>
          <a href="parceiros.html">Parceiros</a>
          <a href="quemsomos.html">Quem somos</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/main.js" defer></script>

</body>
</html>
