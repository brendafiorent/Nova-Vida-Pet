<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apadrinhar - Nova Vida Pet</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-apadrinhar">

  <!-- HEADER -->
  <header class="header">

    <div class="logo-area">
      <a href="index.html"><img src="imagens/Logo nova vida pet deitada.png" alt="Logo Nova Vida Pet" class="logo"></a>
    </div>

    <nav class="menu">
      <a href="adocao.html">Adoção</a>
      <a href="doacao.html">Doação</a>
      <a href="apadrinhar.html">Apadrinhar</a>
      <a href="parceiros.html">Parceiros</a>
      <a href="quemsomos.html">Quem somos</a>
    </nav>

    <div class="header-btns">
      <button class="btn-login">Entrar</button>
      <button class="btn-cadastro">Cadastre-se</button>
    </div>

  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="adocao-main">

    <!-- FILTROS -->
    <aside class="filtros">
      <h2 class="filtros-titulo">Filtros</h2>

      <div class="filtro-grupo">
        <div class="filtro-grupo-topo">
          <h3>Espécie</h3>
        </div>
        <div class="checkboxes">
          <label><input type="checkbox"> Cachorros</label>
          <label><input type="checkbox"> Gatos</label>
          <label><input type="checkbox"> Roedores</label>
        </div>
      </div>

      <div class="filtro-grupo">
        <h3>Sexo</h3>
        <div class="filtro-tags">
          <button class="tag">Fêmea</button>
          <button class="tag">Macho</button>
        </div>
      </div>

      <div class="filtro-grupo">
        <h3>Porte</h3>
        <div class="filtro-tags">
          <button class="tag">Pequeno</button>
          <button class="tag">Médio</button>
          <button class="tag">Grande</button>
        </div>
      </div>

      <div class="filtro-grupo">
        <h3>Idade</h3>
        <div class="filtro-tags">
          <button class="tag">Filhote</button>
          <button class="tag">Adulto</button>
          <button class="tag">Idoso</button>
        </div>
      </div>

      <div class="filtro-acoes">
        <button class="btn-aplicar">Aplicar</button>
        <button class="btn-limpar">Limpar</button>
      </div>
    </aside>

    <!-- ÁREA DE ANIMAIS -->
    <section class="adocao-content">

      <div class="search-bar">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Procure aqui...">
      </div>

      <div class="animais-grid">

        <div class="animal-card" data-id="zezinho">
          <div class="card-img">
            <img src="imagens/cachorro.jpeg" alt="Zézinho">
            <button class="btn-favoritar" aria-label="Favoritar">♡</button>
          </div>
          <div class="animal-rodape">
            <span class="animal-nome">Zézinho</span>
            <span class="animal-genero">
              <img src="imagens/Heart with dog paw.png" alt=""> ♂
            </span>
          </div>
          <button class="btn-adotar">Apadrinhar!</button>
        </div>

        <div class="animal-card" data-id="belinha">
          <div class="card-img">
            <img src="imagens/coitada.avif" alt="Belinha">
            <button class="btn-favoritar" aria-label="Favoritar">♡</button>
          </div>
          <div class="animal-rodape">
            <span class="animal-nome">Belinha</span>
            <span class="animal-genero">
              <img src="imagens/Heart with dog paw.png" alt=""> ♀
            </span>
          </div>
          <button class="btn-adotar">Apadrinhar!</button>
        </div>

        <div class="animal-card" data-id="batman">
          <div class="card-img">
            <img src="imagens/BLACK-CAT-SITIA-CRETE.jpg" alt="Batman">
            <button class="btn-favoritar" aria-label="Favoritar">♡</button>
          </div>
          <div class="animal-rodape">
            <span class="animal-nome">Batman</span>
            <span class="animal-genero">
              <img src="imagens/Heart with dog paw.png" alt=""> ♂
            </span>
          </div>
          <button class="btn-adotar">Apadrinhar!</button>
        </div>

        <div class="animal-card" data-id="salem">
          <div class="card-img">
            <img src="imagens/gato gordo.jfif" alt="Salém">
            <button class="btn-favoritar" aria-label="Favoritar">♡</button>
          </div>
          <div class="animal-rodape">
            <span class="animal-nome">Salém</span>
            <span class="animal-genero">
              <img src="imagens/Heart with dog paw.png" alt=""> ♀
            </span>
          </div>
          <button class="btn-adotar">Apadrinhar!</button>
        </div>

        <div class="animal-card" data-id="pitico">
          <div class="card-img">
            <img src="imagens/pitico.avif" alt="Pítico">
            <button class="btn-favoritar" aria-label="Favoritar">♡</button>
          </div>
          <div class="animal-rodape">
            <span class="animal-nome">Pítico</span>
            <span class="animal-genero">
              <img src="imagens/Heart with dog paw.png" alt=""> ♂
            </span>
          </div>
          <button class="btn-adotar">Apadrinhar!</button>
        </div>

        <div class="animal-card" data-id="carmina">
          <div class="card-img">
            <img src="imagens/talvez.avif" alt="Carmina">
            <button class="btn-favoritar" aria-label="Favoritar">♡</button>
          </div>
          <div class="animal-rodape">
            <span class="animal-nome">Carmina</span>
            <span class="animal-genero">
              <img src="imagens/Heart with dog paw.png" alt=""> ♀
            </span>
          </div>
          <button class="btn-adotar">Apadrinhar!</button>
        </div>

        <div class="animal-card" data-id="thor">
          <div class="card-img">
            <img src="imagens/thor.png" alt="Thor">
            <button class="btn-favoritar" aria-label="Favoritar">♡</button>
          </div>
          <div class="animal-rodape">
            <span class="animal-nome">Thor</span>
            <span class="animal-genero">
              <img src="imagens/Heart with dog paw.png" alt=""> ♂
            </span>
          </div>
          <button class="btn-adotar">Apadrinhar!</button>
        </div>

        <div class="animal-card" data-id="safira">
          <div class="card-img">
            <img src="imagens/diva.webp" alt="Safira">
            <button class="btn-favoritar" aria-label="Favoritar">♡</button>
          </div>
          <div class="animal-rodape">
            <span class="animal-nome">Safira</span>
            <span class="animal-genero">
              <img src="imagens/Heart with dog paw.png" alt=""> ♀
            </span>
          </div>
          <button class="btn-adotar">Apadrinhar!</button>
        </div>

      </div>

      <div class="ver-mais-wrapper">
        <button class="btn-ver-mais">Ver mais...</button>
      </div>

    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer footer-rosa">
    <div class="footer-logo">
      <img src="imagens/Logo nova vida pet deitada.png" alt="Logo Nova Vida Pet">
    </div>
    <div class="socials">
      <div class="social">
        <img src="imagens/Instagram.png" alt="Instagram">
      </div>
      <div class="social">
        <img src="imagens/Vector face.png" alt="Facebook">
      </div>
    </div>
    <div class="footer-menu">
      <h3>Menu</h3>
      <div class="footer-links">
        <div>
          <a href="adocao.html">Adoção</a>
          <a href="doacao.html">Doação</a>
          <a href="apadrinhar.html">Apadrinhar</a>
        </div>
        <div>
          <a href="#">Voluntariar-se</a>
          <a href="parceiros.html">Parceiros</a>
          <a href="quemsomos.html">Quem somos</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/main.js" defer></script>

</body>
</html>
