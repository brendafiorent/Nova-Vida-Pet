<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastrar - Nova Vida Pet</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-cadastrar">

  
  <header class="header">
    <div class="logo-area">
      <a href="index.html"><img src="imagens/Logo nova vida pet deitada.png" alt="Logo Nova Vida Pet" class="logo"></a>
    </div>
    <nav class="menu">
      <a href="adocao.html">Adoção</a>
      <a href="doacao.html">Doação</a>
      <a href="apadrinhar.html">Apadrinhar</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="parceiros.html">Parceiros</a>
      <a href="quemsomos.html">Quem somos</a>
    </nav>
    <div class="header-btns">
      <a href="entrar.html" class="btn-login">Entrar</a>
      <a href="cadastrar.html" class="btn-cadastro">Cadastre-se</a>
    </div>
  </header>

  
  <main class="cadastrar-main">

    <div class="cadastrar-card">

      
      <div class="cadastrar-header">
        <h1 class="cadastrar-titulo">Boas vindas a<br>Nova Vida Pet!</h1>
        <p class="cadastrar-subtitulo">Crie sua conta</p>
      </div>

      
      <div class="cadastrar-form">

        <div class="cadastrar-col">
          <input type="email"    class="cadastrar-input" placeholder="E-mail">
          <input type="text"     class="cadastrar-input" placeholder="CPF/CNPJ">
        </div>

        <div class="cadastrar-col">
          <input type="tel"      class="cadastrar-input" placeholder="Celular">
          <input type="password" class="cadastrar-input" placeholder="Criar sua senha">
          <input type="password" class="cadastrar-input" placeholder="Repita a senha">
          <button class="btn-criar-conta">Criar a conta</button>
        </div>

      </div>

    </div>

  </main>

  <script src="js/main.js" defer></script>

</body>
</html>
