<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova Vida Pet — Formulário de Adoção</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="page-adocao-form4">

  
  <header class="header">
    <div class="logo-area">
      <a href="index.html"><img src="imagens/Logo nova vida pet deitada.png" alt="Logo Nova Vida Pet" class="logo"></a>
    </div>
    <nav class="menu">
      <a href="adocao.html">Adoção</a>
      <a href="doacao.html">Doação</a>
      <a href="apadrinhar.html">Apadrinhar</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="parceiros.html">Parceiros</a>
      <a href="quemsomos.html">Quem somos</a>
    </nav>
    <div class="header-btns">
      <a href="entrar.html" class="btn-login">Entrar</a>
      <a href="cadastrar.html" class="btn-cadastro">Cadastre-se</a>
    </div>
  </header>

  
  <main class="form-main">
    <a href="adocao-form3.html" class="form-voltar">&#8592;</a>

    
    <div class="form-steps">
      
      <div class="step-circle step-ativo">
        <img src="imagens/Full Family.png" alt="Família">
      </div>
      
      <div class="step-circle step-ativo">
        <img src="imagens/Dog Heart.png" alt="Pet">
      </div>
      
      <div class="step-circle step-ativo">
        <img src="imagens/Exterior.png" alt="Moradia">
      </div>
      
      <div class="step-circle step-ativo">
        <img src="imagens/Check Mark.png" alt="Concluído">
      </div>
    </div>

    
    <div class="vistoria-wrap">
      <p class="vistoria-pergunta">
        Você permite que a sua residência seja vistoriada à critério das ONGs/protetores
        para averiguação das respostas coletadas neste formulário, caso julguem necessário,
        ao processo de adoção?
      </p>

      <div class="vistoria-opcoes" data-grupo="vistoria">
        <button class="opcao-btn" data-opcao="A">
          <span class="opcao-letra">A</span> Sim
        </button>
        <button class="opcao-btn" data-opcao="B">
          <span class="opcao-letra">B</span> Não
        </button>
      </div>

      
      <div class="form-continuar-wrap">
        <a href="adocao-final.html" class="btn-form-continuar">Continuar</a>
      </div>
    </div>

  </main>

  <script src="js/main.js" defer></script>
  <script>
    
    const opcoes = document.querySelectorAll('.vistoria-opcoes .opcao-btn');
    opcoes.forEach(function(btn) {
      btn.addEventListener('click', function() {
        opcoes.forEach(function(b) { b.classList.remove('selecionado'); });
        btn.classList.add('selecionado');
      });
    });
  </script>

</body>
</html>
